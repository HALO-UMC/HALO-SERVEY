<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <!-- 기본 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF7B10" />

    <!-- 파비콘 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 페이지 기본 정보 -->
    <title>부모님에 대해 얼마나 알고 있나요? | HALO</title>
    <meta
      name="description"
      content="부모님을 얼마나 알고 있는지 돌아보고, 지금 나에게 필요한 HALO 스토리북을 추천받아보세요."
    />

    <!-- 대표 URL -->
    <link
      rel="canonical"
      href="https://halo-servey.vercel.app/"
    />

    <!-- 카카오톡·SNS 링크 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="HALO" />

    <meta
      property="og:title"
      content="HALO:부모님에 대해 얼마나 알고 있나요?"

      property="og:description"
      content="부모님을 떠올리며 나에게 필요한 스토리북을 찾아보세요."
    />

    <meta
      property="og:url"
      content="https://halo-servey.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://halo-servey.vercel.app/og-image.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://halo-servey.vercel.app//og-image.png"
    />

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="HALO 부모님 이해도 설문 대표 이미지"
    />

    <!-- X·기타 SNS 미리보기 -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="부모님에 대해 얼마나 알고 있나요?"
    />

    <meta
      name="twitter:description"
      content="부모님을 떠올리며 지금 나에게 필요한 HALO 스토리북을 찾아보세요."
    />

    <meta
      name="twitter:image"
      content="https://실제배포주소.com/og-image.png"
    />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
